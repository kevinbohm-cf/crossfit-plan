<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c0e">
<title>Kevin · Z3 · Deadly Dozen</title>
<style>
:root{
  --bg:#0a0c0e; --card:#14181c; --card2:#1b2026; --border:#262d35;
  --text:#f2f5f7; --text2:#a8b2bd; --text3:#6b7681;
  --bone:#e8e2d4; --green:#30d158; --red:#ff453a; --amber:#ffb020; --ice:#64d2ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
#app{max-width:560px;margin:0 auto;padding-bottom:92px}
button,input,select,textarea{font-family:inherit}

#header{padding:16px 16px 12px;border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,#101418,#0a0c0e)}
#header h1{margin:0;font-size:1.5rem;font-weight:800;letter-spacing:2.5px;text-transform:uppercase}
#header h1 span{color:var(--bone)}
.hsub{color:var(--text3);font-size:.75rem;letter-spacing:1.4px;text-transform:uppercase;margin-top:3px}
.countdown{margin-top:11px;display:flex;align-items:baseline;gap:9px;
  border-left:3px solid var(--bone);padding-left:11px}
.countdown b{font-size:2rem;font-weight:800;line-height:1;letter-spacing:-1px}
.countdown span{font-size:.72rem;color:var(--text2);text-transform:uppercase;letter-spacing:1.1px}

#tabs{display:flex;gap:6px;overflow-x:auto;padding:11px 16px;border-bottom:1px solid var(--border);scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:7px 13px;border-radius:20px;background:var(--card);
  border:1px solid var(--border);color:var(--text2);font-size:.77rem;font-weight:700;white-space:nowrap;cursor:pointer}
.tab.on{background:var(--bone);color:#0a0c0e;border-color:var(--bone)}

#main{padding:14px 16px}
.view{display:none}.view.on{display:block}

.banner{border-radius:14px;padding:15px;margin-bottom:14px;background:var(--card);border:1px solid var(--border)}
.banner .ph{font-size:.66rem;letter-spacing:1.6px;text-transform:uppercase;color:var(--bone);font-weight:800}
.banner h2{margin:5px 0 6px;font-size:1.15rem;font-weight:800}
.banner p{margin:0;color:var(--text2);font-size:.85rem}

.day{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:9px;overflow:hidden}
.dh{display:flex;align-items:center;gap:11px;padding:13px 14px;cursor:pointer}
.rail{width:3px;height:34px;border-radius:2px;flex:0 0 auto}
.dh-t{flex:1;min-width:0}
.dh-t h3{margin:0;font-size:.96rem;font-weight:700}
.dh-t .sub{font-size:.75rem;color:var(--text3);margin-top:1px}
.chev{color:var(--text3);font-size:1.3rem;transition:transform .18s}
.day.open .chev{transform:rotate(90deg)}
.db{display:none;padding:0 14px 14px}
.day.open .db{display:block}

.block{background:var(--card2);border-radius:11px;padding:11px;margin-bottom:9px}
.bl{font-size:.66rem;letter-spacing:1.3px;text-transform:uppercase;color:var(--bone);font-weight:800;margin-bottom:8px}
.ex{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.ex:last-child{border-bottom:none;padding-bottom:0}
.ex-i{flex:1;min-width:0}
.ex-n{font-size:.89rem;font-weight:600}
.ex-l{font-size:.82rem;color:var(--ice);margin-top:1px}
.ex-c{font-size:.77rem;color:var(--text3);margin-top:3px}
.ex-log{font-size:.75rem;color:var(--green);margin-top:3px;font-weight:600}
.bwrap{display:flex;flex-direction:column;gap:5px;flex:0 0 auto}
.ib,.logb{width:32px;height:30px;border-radius:8px;border:1px solid var(--border);
  background:transparent;color:var(--text2);font-size:.82rem;cursor:pointer;padding:0}
.logb.done{background:var(--green);border-color:var(--green);color:#000}

.wu{background:rgba(100,210,255,.07);border-left:3px solid var(--ice);border-radius:0 9px 9px 0;
  padding:10px 12px;margin-bottom:9px;font-size:.81rem;color:var(--text2)}
.wu b{display:block;color:var(--ice);font-size:.66rem;letter-spacing:1.3px;text-transform:uppercase;margin-bottom:4px}
.note{border-radius:9px;padding:10px 12px;margin-bottom:9px;font-size:.81rem;
  background:rgba(255,176,32,.08);border-left:3px solid var(--amber);color:var(--text2)}
.note.g{background:rgba(48,209,88,.08);border-left-color:var(--green)}
.note.r{background:rgba(255,69,58,.08);border-left-color:var(--red)}
.sim{background:linear-gradient(135deg,rgba(232,226,212,.13),rgba(232,226,212,.04));
  border:1px solid rgba(232,226,212,.3);border-radius:11px;padding:12px;margin-bottom:9px}
.sim .body{font-size:.84rem;color:var(--text)}

.hero{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:15px;margin-bottom:12px}
.hero .dt{font-size:.72rem;color:var(--text3);text-transform:uppercase;letter-spacing:1.3px}
.hero .wd{font-size:1.5rem;font-weight:800;margin-top:2px}
.hero .ty{font-size:.85rem;margin-top:2px;font-weight:600}
.hrv{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:13px;margin-bottom:12px}
.hrv h4{margin:0 0 8px;font-size:.72rem;letter-spacing:1.3px;text-transform:uppercase;color:var(--bone)}
.hrvrow{display:flex;gap:8px}
.hrvrow input{flex:1;background:var(--card2);border:1px solid var(--border);border-radius:9px;
  padding:10px;color:var(--text);font-size:.9rem}
.hrvrow button{padding:10px 16px;border-radius:9px;border:none;background:var(--bone);color:#000;font-weight:700;cursor:pointer}
#hrvout{margin-top:9px;padding:10px;border-radius:9px;font-size:.83rem;display:none}

.rt{width:100%;border-collapse:collapse;font-size:.79rem;margin-top:6px}
.rt th{text-align:left;color:var(--text3);font-size:.64rem;letter-spacing:1px;text-transform:uppercase;
  padding:6px 4px;border-bottom:1px solid var(--border);font-weight:700}
.rt td{padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:top}
.rt td.i{color:var(--bone);font-weight:800;width:20px}
.rt .w{color:var(--ice);white-space:nowrap}
.rt .o{color:var(--amber);white-space:nowrap}
h4.sec{font-size:.68rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--bone);margin:18px 0 6px;font-weight:800}
p.body{font-size:.85rem;color:var(--text2);margin:0 0 9px}
ul.body{font-size:.85rem;color:var(--text2);margin:0 0 9px;padding-left:18px}
ul.body li{margin-bottom:5px}

.meal{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.meal:last-child{border-bottom:none}
.meal .t{flex:0 0 52px;color:var(--bone);font-size:.78rem;font-weight:800}
.meal .m{flex:1}
.meal .m .h{font-size:.86rem;font-weight:600}
.meal .m .d{font-size:.79rem;color:var(--text2);margin-top:2px}
.meal .m .k{font-size:.75rem;color:var(--ice);margin-top:3px}
.tot{display:flex;gap:6px;margin-top:10px}
.tot div{flex:1;background:var(--card2);border-radius:9px;padding:8px;text-align:center}
.tot b{display:block;font-size:1rem;font-weight:800}
.tot span{font-size:.63rem;color:var(--text3);text-transform:uppercase;letter-spacing:.8px}

.fld{margin-bottom:10px}
.fld label{display:block;font-size:.7rem;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;font-weight:700}
.fld input,.fld textarea,.fld select{width:100%;background:var(--card2);border:1px solid var(--border);
  border-radius:9px;padding:11px;color:var(--text);font-size:.92rem}
.fld textarea{min-height:66px;resize:vertical}
.set-row{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.set-row .set-num{flex:0 0 24px;font-size:.78rem;color:var(--text3);font-weight:700}
.set-row input{flex:1;min-width:0;background:var(--card2);border:1px solid var(--border);border-radius:8px;
  padding:9px 6px;color:var(--text);font-size:.88rem;text-align:center}
.set-row .set-del{flex:0 0 30px;height:30px;border-radius:8px;border:1px solid var(--border);
  background:transparent;color:var(--text3);font-size:1rem;cursor:pointer}
.fb-emoji-row{display:flex;gap:6px;margin:8px 0 14px}
.fb-emoji{flex:1;text-align:center;padding:10px 2px;border-radius:10px;border:1px solid var(--border);
  background:var(--card2);cursor:pointer;font-size:1.3rem}
.fb-emoji.sel{border-color:var(--bone);background:rgba(232,226,212,.12)}
.fb-emoji .lbl{display:block;font-size:.6rem;color:var(--text3);margin-top:2px;text-transform:uppercase;letter-spacing:.5px}
.fb-star-row{display:flex;gap:8px;margin:8px 0 14px;font-size:1.6rem}
.fb-star{cursor:pointer;color:var(--border)}
.fb-star.on{color:var(--amber)}
.rt-item{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:.86rem;
  border-bottom:1px solid rgba(255,255,255,.05)}
.rt-n{font-weight:600}
.rt-d{color:var(--ice);white-space:nowrap;font-size:.8rem;text-align:right}
.rt-c{font-size:.75rem;color:var(--text3);margin:-3px 0 5px}
.blogb{width:100%;margin-top:11px;padding:10px;border-radius:9px;border:1px solid var(--border);
  background:transparent;color:var(--text2);font-size:.82rem;font-weight:700;cursor:pointer}
.blogb.done{background:rgba(48,209,88,.14);border-color:var(--green);color:var(--green)}
.btn{width:100%;padding:13px;border-radius:11px;border:none;background:var(--bone);color:#000;
  font-size:.93rem;font-weight:800;cursor:pointer;margin-top:4px}
.btn.sec{background:transparent;border:1px solid var(--border);color:var(--text2)}
.btn.dan{background:transparent;border:1px solid var(--red);color:var(--red)}

#nav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;display:flex;
  background:rgba(12,15,18,.96);backdrop-filter:blur(14px);border-top:1px solid var(--border);
  padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:40}
.ni{flex:1;text-align:center;color:var(--text3);cursor:pointer;font-size:.62rem;
  letter-spacing:.8px;text-transform:uppercase;font-weight:700}
.ni .ic{font-size:1.1rem;display:block;margin-bottom:1px}
.ni.on{color:var(--bone)}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:60;display:none;
  align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;
  border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  border-top:1px solid var(--border)}
.sheet h3{margin:0 0 3px;font-size:1.05rem;font-weight:800}
.sheet .sh-sub{color:var(--text3);font-size:.78rem;margin-bottom:14px}
.yt{display:block;text-align:center;padding:11px;border-radius:10px;background:var(--card2);
  border:1px solid var(--border);color:var(--ice);text-decoration:none;font-size:.87rem;font-weight:700;margin-top:10px}
.feed{margin-top:9px;padding:10px;border-radius:9px;font-size:.8rem;text-align:center;display:none}
</style>
</head>
<body>
<div id="app">

<div id="header">
  <h1>Kevin <span>· Z3</span></h1>
  <div class="hsub">Deadly Dozen Race Prep · 27.7.–6.9.2026</div>
  <div class="countdown"><b id="cd">–</b><span>Tage bis zur<br>Weltmeisterschaft</span></div>
</div>

<div id="tabs"></div>

<div id="main">
  <div class="view on" id="v-today"></div>
  <div class="view" id="v-plan"></div>
  <div class="view" id="v-race"></div>
  <div class="view" id="v-fuel"></div>
  <div class="view" id="v-profile"></div>
</div>

<div id="nav">
  <div class="ni on" data-v="today"><span class="ic">📅</span>Heute</div>
  <div class="ni" data-v="plan"><span class="ic">📋</span>Plan</div>
  <div class="ni" data-v="race"><span class="ic">🏁</span>Race</div>
  <div class="ni" data-v="fuel"><span class="ic">🍚</span>Fuel</div>
  <div class="ni" data-v="profile"><span class="ic">👤</span>Profil</div>
</div>
</div>

<div class="modal" id="m-log"><div class="sheet" id="s-log"></div></div>
<div class="modal" id="m-info"><div class="sheet" id="s-info"></div></div>
<div class="modal" id="m-fb"><div class="sheet" id="s-fb"></div></div>

<script>
/* ============ STORAGE ============ */
var MEM={};
function ls(k,v){
  try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); return v; }
  catch(e){
    try{ if(v===undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k,v); return v; }
    catch(e2){ if(v===undefined) return (MEM[k]===undefined?null:MEM[k]); MEM[k]=v; return v; }
  }
}
function del(k){ try{localStorage.removeItem(k)}catch(e){} try{sessionStorage.removeItem(k)}catch(e){} delete MEM[k]; }
function allLogs(){
  var o={},i,k;
  try{ for(i=0;i<localStorage.length;i++){k=localStorage.key(i); if(k.indexOf('z3_log_')===0) o[k]=localStorage.getItem(k);} }catch(e){}
  for(k in MEM){ if(k.indexOf('z3_log_')===0) o[k]=MEM[k]; }
  return o;
}
function todayLogs(){
  var all=allLogs(), out={}, todayStr=new Date().toDateString();
  for(var k in all){
    try{
      var arr=JSON.parse(all[k]); if(!Array.isArray(arr)) arr=[arr];
      var todays=arr.filter(function(e){ return e&&e.date&&new Date(e.date).toDateString()===todayStr; });
      if(todays.length) out[k]=JSON.stringify(todays);
    }catch(e){}
  }
  return out;
}
function getLogArray(k){ var r=ls('z3_log_'+k); if(!r) return []; try{ var v=JSON.parse(r); return Array.isArray(v)?v:[v]; }catch(e){ return []; } }
function getLog(k){ var arr=getLogArray(k); return arr.length?arr[arr.length-1]:null; }
function pushLog(k,entry){ var arr=getLogArray(k); arr.push(entry); ls('z3_log_'+k, JSON.stringify(arr)); }
function deleteLogAt(k,idx){ var arr=getLogArray(k); if(idx>=0&&idx<arr.length){ arr.splice(idx,1); ls('z3_log_'+k, JSON.stringify(arr)); } }

/* ---- Tagesfeedback ---- */
var FB_EMOJI=[['1','😴','Müde'],['2','😐','Ok'],['3','🙂','Gut'],['4','😄','Stark'],['5','🤩','Bestform']];
function fbKey(w,i){ return 'w'+w+'_d'+i; }
function fbWidgetHtml(w,i){
  var fb=getFb(w,i);
  if(fb){
    var em=FB_EMOJI.find(function(x){return x[0]===fb.emoji});
    var stars='★★★★★☆☆☆☆☆'.slice(5-(fb.stars||0),10-(fb.stars||0));
    return '<div class="note g fb-summary" data-fbw="'+w+'" data-fbi="'+i+'" style="cursor:pointer">'+
      '<b>Tagesfeedback'+(em?' '+em[1]+' '+em[2]:'')+(fb.stars?' · '+stars:'')+'</b>'+
      (fb.notes?'<br>'+fb.notes:'')+
      '<div style="font-size:.72rem;color:var(--text3);margin-top:4px">Antippen zum Bearbeiten</div></div>';
  }
  return '<button class="btn sec fb-open" data-fbw="'+w+'" data-fbi="'+i+'" style="margin-bottom:12px">✍️ Wie war die Einheit?</button>';
}
function getFb(w,i){ var r=ls('z3_fb_'+fbKey(w,i)); if(!r) return null; try{return JSON.parse(r)}catch(e){return null} }
function setFb(w,i,o){ o.date=new Date().toISOString(); ls('z3_fb_'+fbKey(w,i), JSON.stringify(o)); }
function allFeedback(){
  var o={},i,k;
  try{ for(i=0;i<localStorage.length;i++){k=localStorage.key(i); if(k.indexOf('z3_fb_')===0) o[k]=localStorage.getItem(k);} }catch(e){}
  for(k in MEM){ if(k.indexOf('z3_fb_')===0) o[k]=MEM[k]; }
  return o;
}
function todayFeedback(){
  var all=allFeedback(), out={}, todayStr=new Date().toDateString();
  for(var k in all){ try{ var v=JSON.parse(all[k]); if(v&&v.date&&new Date(v.date).toDateString()===todayStr) out[k]=all[k]; }catch(e){} }
  return out;
}

/* ============ LABOURS · Race vs Überlast ============ */
var LAB={
 farm  :{n:'KB Farmers Carry',   race:'2×24 kg',      over:'2×32 kg',        u:'m',    full:240, t:'labour'},
 kbdl  :{n:'KB Deadlift',        race:'32 kg',        over:'40 kg',          u:'Reps', full:60,  t:'labour'},
 lunge :{n:'DB Lunge',           race:'2×12,5 kg',    over:'2×20 kg',        u:'m',    full:60,  t:'labour'},
 snatch:{n:'DB Snatch alt.',     race:'15 kg',        over:'22,5 kg',        u:'Reps', full:60,  t:'labour'},
 bbj   :{n:'Burpee Broad Jump',  race:'Körpergewicht',over:'+10 kg Weste',   u:'m',    full:60,  t:'labour'},
 goblet:{n:'KB Goblet Squat',    race:'16 kg',        over:'24 kg',          u:'Reps', full:60,  t:'labour'},
 front :{n:'WP Front Carry',     race:'25 kg',        over:'35 kg (25+10)',  u:'m',    full:240, t:'labour'},
 dbpp  :{n:'DB Push Press',      race:'2×12,5 kg',    over:'2×20 kg',        u:'Reps', full:60,  t:'labour'},
 bear  :{n:'Bear Crawl',         race:'Körpergewicht',over:'+10 kg Weste',   u:'m',    full:120, t:'labour'},
 cp    :{n:'WP Clean & Press',   race:'15 kg',        over:'20 kg',          u:'Reps', full:60,  t:'labour'},
 ohc   :{n:'WP Overhead Carry',  race:'15 kg',        over:'20 kg',          u:'m',    full:180, t:'labour'},
 devil :{n:'DB Devil Press',     race:'2×10 kg',      over:'2×15 kg',        u:'Reps', full:20,  t:'labour'}
};
function lab(key,w,frac){
  var L=LAB[key], W_=WK[w];
  var vol = Math.round(L.full * (W_.v/100) * (frac||1));
  var load = W_.load==='over' ? L.over : L.race;
  return vol+' '+L.u+' @ '+load;
}
function labLoadTag(w){ return WK[w].load==='over' ? 'ÜBERLAST' : 'Race-Last'; }

/* ============ WOCHEN ============ */
var WK={
1:{d:['27. Juli','28. Juli','29. Juli','30. Juli','31. Juli','1. August','2. August'],
   ph:'Phase · Ramp-in', h2:'Woche 1 · 27. Juli – 2. August',
   p:'Umstellung auf Renn-Spezifik. Erst die Standards an Race-Last lernen – ab W2 wird überladen. Laufen kommt strukturiert zurück, Kraft läuft ab hier nur noch als Erhalt.',
   v:50, load:'race',
   sq:'3×5 @ 105 kg · RPE 7', rdl:'3×8 @ 90 kg', pp:'4×3 @ 75 kg', sp:'4×4 @ 57,5 kg',
   run:'6 × 400 m @ 2:05–2:10', rest:'90 s Trabpause', sa:'8 km Z2 · HF 125–140'},
2:{d:['3. August','4. August','5. August','6. August','7. August','8. August','9. August'],
   ph:'Phase · Überlast', h2:'Woche 2 · 3.–9. August',
   p:'Stationen gehen auf Überlast: Farmers 2×32 statt 2×24, Goblet 24 statt 16, Devil Press 2×15 statt 2×10. Umfang 75 %. Erste Couplets Journey → Labour.',
   v:75, load:'over',
   sq:'3×5 @ 110 kg · RPE 7', rdl:'3×8 @ 92,5 kg', pp:'4×3 @ 77,5 kg', sp:'4×4 @ 60 kg',
   run:'8 × 400 m @ 2:00–2:05', rest:'90 s Trabpause', sa:'10 km Z2 · HF 125–140'},
3:{d:['10. August','11. August','12. August','13. August','14. August','15. August','16. August'],
   ph:'Phase · Überlast', h2:'Woche 3 · 10.–16. August',
   p:'Härteste Labour-Woche: voller Renn-Umfang auf Überlast. 240 m Farmers mit 2×32 kg ohne Kreide – wenn das sitzt, fühlen sich 24 kg am Renntag wie nichts an.',
   v:100, load:'over',
   sq:'3×4 @ 110 kg · RPE 7', rdl:'3×6 @ 92,5 kg', pp:'3×3 @ 80 kg', sp:'4×3 @ 60 kg',
   run:'10 × 400 m @ 1:58–2:03', rest:'75 s Trabpause', sa:'12 km Z2 mit 4 Labour-Stopps'},
4:{d:['17. August','18. August','19. August','20. August','21. August','22. August','23. August'],
   ph:'Phase · Spezifik', h2:'Woche 4 · 17.–23. August',
   p:'Zurück auf exakte Race-Last – jetzt wird alles leicht. Samstag: volle Simulation über 12 Journeys mit deinem realistischen Pair-Anteil. Danach weißt du, was das Rennen kostet.',
   v:100, load:'race',
   sq:'3×3 @ 110 kg · RPE 7', rdl:'3×6 @ 92,5 kg', pp:'3×3 @ 80 kg', sp:'3×3 @ 62,5 kg',
   run:'6 × 400 m @ 1:55–2:00 · scharf', rest:'60 s Trabpause', sa:'VOLLE SIMULATION'},
5:{d:['24. August','25. August','26. August','27. August','28. August','29. August','30. August'],
   ph:'Phase · Peak', h2:'Woche 5 · 24.–30. August',
   p:'Kurze Überlast-Reize unter der Woche, Samstag halbe Simulation an Race-Last im Renntempo. Letzter harter Tag – danach Taper.',
   v:75, load:'over',
   sq:'2×3 @ 105 kg · RPE 6', rdl:'2×6 @ 90 kg', pp:'3×2 @ 80 kg', sp:'3×3 @ 60 kg',

var DB={
'kb farmers carry':['KB in jeder Hand, aufrecht gehen oder laufen, Schultern zurück, Core fest. 30-m-Bahn, an jedem Ende mit beiden Füßen über die Linie. Absetzen jederzeit erlaubt – aber nur genau dort, wo du stehst.','Griffausdauer ohne Kreide ist der Kern. Im Training auf 2×32 kg – am Renntag fühlen sich 2×24 kg dann leicht an.','farmers+carry+kettlebell+technique+grip'],
'kb deadlift':['Gerade Arme, KB vom Boden, Knie und Hüfte voll strecken, Schultern hinter die KB. KB muss jede Wiederholung den Boden berühren – nicht fallen lassen.','60 Reps am Stück ist muskuläre Ausdauer, keine Kraft. Ohne Kreide, ohne Straps. Pausen nur stehend an Ort und Stelle.','kettlebell+deadlift+technique+standard'],
'db lunge':['DB in beiden Händen an den Seiten, ausschreitende Lunges. Hinteres Knie berührt den Boden, Beine müssen alternieren. Oben Knie und Hüfte voll strecken.','Kein Schritt nach vorn zwischen den Lunges – das ist der häufigste No-Rep. Übe den durchziehenden Rhythmus.','walking+lunge+dumbbell+technique'],

'kb goblet squat':['KB vor der Brust über der Gürtellinie halten, mindestens bis parallel. Unterarme dürfen sich unten nicht auf den Beinen abstützen. Oben voll strecken.','Bei 60 Reps entscheidet die Atmung, nicht die Beine. Feste Blöcke von 15–20 statt bis zum Versagen.','goblet+squat+kettlebell+technique'],
'wp front carry':['Hantelscheibe mit beiden Armen vor dem Körper tragen – nicht auf der Schulter, nicht auf dem Kopf. Gehen oder laufen erlaubt.','240 m mit gestreckten Armen vorne belastet den oberen Rücken massiv. Im Training 35 kg, damit 25 kg am Renntag Erholung sind.','weight+plate+front+carry+technique'],
'db push press':['DB an den Schultern (nicht höher als die Ohren), Kniebeugung und explosive Streckung, Ellbogen oben komplett strecken.','Core beim Hüftimpuls fest halten. In Blöcken von 15 arbeiten – so teilst du es auch im Rennen mit deiner Partnerin.','dumbbell+push+press+technique'],
'bear crawl':['Auf Händen und Füßen, Knie nie am Boden. Immer mindestens eine Hand und ein Fuß am Boden, kein Galoppieren. Am Ende der Bahn mit Händen und Füßen über die Linie.','Deine teuerste Station: 120 m isometrische Anti-Extension bei 197 cm Hebel – und der Hauptauslöser für die Bauchkrämpfe. Hüfte tief, kurze Züge, durch die Nase atmen statt zu pressen. Im Rennen in 15–20-m-Blöcken mit der Partnerin wechseln.','bear+crawl+technique+efficiency'],
'burpee broad jump':['Brust und Oberschenkel auf den Boden, hoch, beidbeinig nach vorn springen und beidbeinig landen. Kein Nachtreten nach der Landung, Hände dürfen nicht nach vorn krabbeln.','Zusammen mit dem Bear Crawl der Grund, warum dein Bauch dicht macht: 60 m wiederholte Rumpfflexion unter hoher Atemfrequenz. Kurze, flache, hochfrequente Sprünge schlagen weite Einzelsprünge – und im Rennen in kurzen Blöcken teilen.','burpee+broad+jump+technique+efficiency'],
'wp clean & press':['Scheibe vom Boden über Kopf, Scheibenmitte direkt über dem Kopf, Ellbogen komplett strecken. Scheibe muss jede Wiederholung den Boden berühren.','60 Reps – Rhythmus schlägt Kraft. Atmen im Ablassen, nicht im Drücken.','weight+plate+clean+and+press'],
'wp overhead carry':['Scheibenmitte direkt über dem Kopf, Ellbogen gestreckt oder gebeugt – aber die Scheibe darf den Kopf nicht berühren. Bei 3 Verwarnungen wirst du skaliert.','Schulterstabilität unter Ermüdung. Genau die Station, an der deine rechte Schulter Feedback gibt – Überlast hier bewusst konservativ.','overhead+plate+carry+shoulder+stability'],
'db devil press':['DB in beiden Händen, Burpee mit Brust und Oberschenkeln auf dem Boden, hoch und die DB in einer Bewegung über Kopf. Ellbogen voll strecken.','Nur 20 Reps – aber als letzte Station nach 12 Läufen. Im Training bewusst müde üben.','devil+press+dumbbell+technique'],
'back squat':['Volle Tiefe, Thorax aufrecht, Core fest. Kein Kippen nach vorn im Aufstieg.','Reiner Erhalt in diesem Zyklus. Kraft ist für dieses Rennen im Überfluss vorhanden – hier geht es nur darum, nichts zu verlieren.','back+squat+technique+crossfit'],
'romanian deadlift':['Stange in Hüfthöhe, Knie leicht gebeugt, Hüfte nach hinten, Stange nah am Körper. Hamstrings dehnen spüren, LWS neutral.','Ab jetzt ohne Straps – der Griff ist Wettkampfvorbereitung. Last bewusst bei 90–92,5 kg gedeckelt.','romanian+deadlift+technique'],

'kadenz-check':['Uhr auf Schrittfrequenz stellen, Ziel 170 Schritte/min. Kürzer und schneller statt weiter ausgreifen.','Von 157 auf 170 – das entlastet Achilles und Knie und macht dich auf 4,8 km spürbar schneller.','running+cadence+170+drills'],
'z2-lauf':['Ruhiges, gleichmäßiges Tempo, HF 125–140. Nase-Atmung sollte möglich sein.','Aerobe Basis für 12 Läufe. Über 90 min oder bei Hitze: trinken ab Minute 30, Kohlenhydrate bei Minute 50–60.','zone+2+running+aerobic+base'],
'griff & core':['Farmers Hold bis kurz vor Griffversagen, Hollow Rocks mit gestrecktem Körper, Plank ohne Hüftabsenken.','Griff ist bei diesem Rennen ein echter Limiter – kein Hilfsmittel erlaubt.','grip+endurance+training+farmers+hold'],
'schwimmen':['Wechsel Kraul/Brust, gleichmäßige Atmung, kein Verkrampfen.','Gelenkschonende Erholung zwischen zwei harten Tagen. Kein Intervalltraining.','freestyle+swimming+recovery+technique'],
'beinpresse':['Füße hüftbreit mittig, Knie oben nicht durchdrücken, kontrolliert tief.','Maschinenkraft ohne axiale Last. Kein Ausbelasten – die Beine gehören der Bahn.','leg+press+technique'],
'unterarm-/griffarbeit':['Schwere Hanteln halten bis kurz vor Versagen, Schultern zurück, Handgelenk neutral.','Direkt trainierbarer Limiter. Ohne Kreide, ohne Handschuhe – genau wie im Rennen.','grip+strength+training+forearm'],

'lat pulldown':['Breiter Griff, leicht zurückgelehnt, Schulterblätter zuerst nach unten ziehen, dann Ellbogen Richtung Gesäßtaschen. Langsam hochlassen.','Simuliert den Pull-Up in der Bewegung. Bewusst leichter als früher, damit du den Lat spürst statt den Nacken.','lat+pulldown+technique+form'],

'rückenstrecker isometrisch':['Auf der Bank oder am Boden, Rumpf gerade in der Luft halten, kein Hohlkreuz, Blick nach unten.','Baut die isometrische Kapazität des linken Erectors auf, ohne die SI-Region unter dynamischer Last zu belasten.','isometric+back+extension+hold'],
'hspu-progression':['An der Wand, sehr langsam absenken (3 Sek, nicht 5), mit den Beinen helfen um wieder hochzukommen.','Zuerst ausführen, solange die Schultern frisch sind. Exzentrische Kraft ist der schnellste Weg zu mehr strikten Wiederholungen.','hspu+negatives+progression+technique'],
'pull-ups':['Schulterbreiter Griff, Schulterblätter aktiv nach unten, Kinn über die Stange, kontrolliert absenken bis volle Streckung.','Bewusst ohne Kreide trainiert – das ist direkte Vorbereitung auf den kreidefreien Grip im Rennen.','pull+up+technique+crossfit'],
'toes-to-bar':['Aus dem Hang die Füße kontrolliert zur Stange bringen, Lat aktiv, kein reines Bein-Schwingen.','Rumpfkontrolle und Griffausdauer – beides zahlt auf die Carries ein.','toes+to+bar+technique+crossfit'],
'bar muscle-up':['Explosiver Zug, Übergang durch aktives Vorlehnen über die Stange, dann drücken bis zur Streckung.','Wenn die Schulter Widerstand meldet: Chest-to-Bar statt Muscle-Up, keine Kompromisse bei der rechten Schulter.','bar+muscle+up+technique+crossfit'],
'labour-touch':['Alle vier Bewegungen an exakter Race-Last, sehr locker, volle Bewegungsqualität statt Tempo.','Taper-Woche: die Bewegungen bleiben im Kopf und im Griff präsent, ohne noch Ermüdung zu erzeugen.','race+standards+technique+review'],
'snatch':['Ein Zug vom Boden in den Überkopf-Squat, Stange nah am Körper, Hüfte explosiv, unter die Stange fahren.','Technikeinheit bei 70–75 % in diesem Zyklus – die Sehnen gehören dem Laufen, nicht dem Maxen.','snatch+technique+olympic+weightlifting'],
'clean & jerk':['Clean explosiv ins Front-Rack, dann Jerk: Dip, Drive, unter die Stange fahren.','Wie beim Snatch: Technik bei 70–75 %, kein Maxen in diesem Zyklus.','clean+and+jerk+technique+crossfit'],
'overhead squat':['Weiter Griff, Stange über dem Hinterkopf, Arme aktiv gestreckt, Hüfte tief, Brust aufrecht.','Zahlt direkt auf den Overhead Carry ein – gleiche Schulterposition, gleiche Rumpfspannung.','overhead+squat+technique+crossfit'],
'rennen':['12 Journeys, 12 Labours, mit Partnerin. Übergaben durch Ablegen, Pacing von Beginn an konservativ.','Der Tag, auf den alles hinarbeitet. Renntaktik: die ersten drei Journeys bewusst langsamer als möglich.','fitness+race+pacing+strategy'],
'rep-labour-wod':['Drei Runden auf Zeit durch KB Deadlift, Goblet Squat und DB Push Press, 90 s Pause zwischen den Runden.','Ein durchlaufender WOD statt drei Einzelstationen mit Wartezeit – kürzer, härter, näher am Renngefühl.','crossfit+wod+kettlebell+dumbbell'],
'incline press neutraler griff':['Neutraler Griff (Handflächen zueinander), Bank leicht angewinkelt, kontrolliert drücken, Ellbogen nicht ganz durchstrecken.','Ersetzt das Bankdrücken mit der Langhantel wegen der rechten Schulter. Neutraler Griff ist schmerzfrei bestätigt.','incline+press+neutral+grip+shoulder'],
'90/90 hüftwechsel':['Beide Beine 90 Grad angewinkelt, aufrecht sitzen, langsam von Seite zu Seite wechseln, ohne die Hände zum Nachhelfen.','Öffnet Innen- und Außenrotation der Hüfte. Direkt vor dem Squatten spürst du den Unterschied in der Tiefe.','90+90+hip+switch+mobility'],
'glute bridge':['Rücken flach am Boden, Füße hüftbreit, Po zuerst anspannen, Becken heben, oben 2 s halten. Rippen unten lassen.','Aktiviert den Po, damit die Hüftstreckung nicht über die LWS läuft – genau der Mechanismus hinter deinem Rückenthema.','glute+bridge+technique+activation'],
'bird dog':['Vierfüßlerstand, gegenüberliegender Arm und Bein gleichzeitig strecken, Becken bleibt waagrecht. Langsam, kein Schwung.','Anti-Rotation und Rumpfkontrolle unter Bewegung – das Muster, das beim Bear Crawl und beim Carry gebraucht wird.','bird+dog+exercise+technique'],
'dead bug':['Auf dem Rücken, LWS gedrückt am Boden, gegenüberliegender Arm und Bein langsam absenken. Sobald die LWS abhebt: Bewegung kleiner machen.','Bringt dir die Rumpfspannung, ohne die Wirbelsäule zu belasten. Ideal als Vorbereitung vor schweren Beugen.','dead+bug+core+technique'],
'copenhagen plank':['Seitlich stützen, oberes Bein auf einer Bank, Hüfte hoch, unteres Bein frei oder angewinkelt.','Adduktoren – zahlt direkt auf Lunges und Bear Crawl ein und schützt die Leiste bei hohem Laufvolumen.','copenhagen+plank+adductor+technique'],
'side plank':['Schulter über dem Ellbogen, Hüfte oben halten, Körper in einer Linie. Nicht durchhängen.','Seitliche Rumpfkette – stabilisiert das Becken beim Laufen und beim einseitigen Carry.','side+plank+technique+core'],
'hollow hold':['Auf dem Rücken, LWS gedrückt, Arme und Beine gestreckt angehoben. Bei Abheben der LWS die Beine höher nehmen.','Grundspannung für alles Gymnastische – Toes-to-Bar, Muscle-Up, HSPU.','hollow+hold+technique+gymnastics'],
'pallof press':['Kabel oder Band seitlich, Griff vor der Brust, langsam nach vorn strecken und zurück, ohne dass sich der Rumpf dreht.','Anti-Rotation im Stand – die direkteste Übertragung auf einseitige Carries und den Farmers Walk.','pallof+press+antirotation+technique'],
'hüftbeuger-dehnung':['Ausfallschritt, hinteres Knie am Boden, Po aktiv anspannen und Becken leicht aufrichten. Nicht ins Hohlkreuz fallen.','Nach dem Training wichtig: verkürzte Hüftbeuger ziehen das Becken nach vorn und belasten den unteren Rücken.','hip+flexor+stretch+technique'],
'bear hold mit atmung':['Bear Hold halten (Knie knapp über dem Boden) und dabei bewusst tief in den Bauch atmen statt die Luft anzuhalten.','Trainiert genau den Konflikt, an dem du im Rennen scheiterst: Rumpf muss spannen, Zwerchfell muss atmen. Wer presst, krampft.','bear+hold+breathing+core'],
'suitcase carry':['Ein Gewicht auf einer Seite, aufrecht gehen, Schulter unten lassen, nicht zur Seite kippen.','Anti-Lateralflexion – die seitliche Bauchwand, die beim Laufen mit müdem Rumpf als Erstes nachgibt.','suitcase+carry+antilateral+core'],
'400 m nach bodenarbeit':['400 m direkt nach einem Bear-Crawl- oder Burpee-Broad-Jump-Block. Aufrecht bleiben, Becken neutral, Schrittfrequenz halten.','Der spezifischste Reiz im ganzen Plan: laufen mit vorermüdeter Bauchwand. Ziel ist Haltung, nicht Tempo.','running+form+fatigue+core'],
'katze-kuh':['Vierfüßlerstand, im Wechsel Rücken runden und sanft absenken. Wirbel für Wirbel, nicht durchdrücken.','Weckt die Wirbelsäule und bringt Bewegung in die Segmente, die nachts steif geworden sind.','cat+cow+mobility+spine'],
'open book':['Seitlage, Knie oben angewinkelt halten, oberen Arm langsam über den Körper öffnen und dem Blick folgen.','Brustwirbelsäule und Schulter in einem – gut für die rechte Schulter und die Overhead-Position.','open+book+thoracic+rotation'],
'wall slides':['Rücken, Kopf und Arme an der Wand, Unterarme langsam nach oben und wieder runter, ohne den Kontakt zu verlieren.','Bringt Schulterblattbewegung und Overhead-Position zurück, ohne Last. Direkt für die rechte Schulter.','wall+slide+shoulder+mobility'],
'couch stretch':['Hinteres Bein an der Wand oder Bank, Po aktiv anspannen und Becken aufrichten. Nicht ins Hohlkreuz fallen.','Hüftbeuger und Quadrizeps. Verkürzte Hüftbeuger ziehen das Becken nach vorn und belasten deinen unteren Rücken.','couch+stretch+hip+flexor'],
'taube':['Vorderes Bein angewinkelt vor dem Körper, hinteres gestreckt, Oberkörper langsam ablegen.','Gesäß und Hüftaußenseite – die Region rund um dein SI-Thema.','pigeon+pose+hip+stretch'],
'hamstring-dehnung':['Bein gestreckt erhöht ablegen, Becken aufrichten statt den Rücken zu runden.','Verkürzte Hamstrings kippen das Becken und ziehen an den Erectoren. Beckenaufrichtung ist hier wichtiger als Reichweite.','hamstring+stretch+technique'],
'lat-dehnung an der stange':['An der Stange festhalten, Hüfte nach hinten schieben, Achsel Richtung Boden sinken lassen.','Entlastet die Schulter nach Overhead-Arbeit und verbessert die Position für Overhead Carry und Snatch.','lat+stretch+bar+shoulder'],

function dbKey(n){ return String(n).toLowerCase().replace(/\s+/g,' ').trim(); }

/* ============ BUILDER ============ */
function ex(n,l,c,k,typ){
  var arr=getLogArray(k), lg=arr.length?arr[arr.length-1]:null, done=lg?' done':'', info=DB[dbKey(n)]?'<button class="ib" data-i="'+encodeURIComponent(n)+'">i</button>':'';
  var sum='';
  if(lg){ sum='<div class="ex-log">✓ '+entrySummary(lg)+(arr.length>1?' · '+arr.length+' Einträge':'')+'</div>'; }
  return '<div class="ex"><div class="ex-i"><div class="ex-n">'+n+'</div>'+
    (l?'<div class="ex-l">'+l+'</div>':'')+(c?'<div class="ex-c">'+c+'</div>':'')+sum+
    '</div><div class="bwrap">'+info+
    '<button class="logb'+done+'" data-k="'+k+'" data-n="'+encodeURIComponent(n)+'" data-t="'+(typ||'strength')+'" data-l="'+encodeURIComponent(l||'')+'">📊</button>'+
    '</div></div>';
}
function blk(l,r){return '<div class="block"><div class="bl">'+l+'</div>'+r+'</div>';}
function wu(t){return '<div class="wu"><b>Warm-Up</b>'+t+'</div>';}
function routine(title,key,items,accent){
  var arr=getLogArray(key), last=arr.length?arr[arr.length-1]:null, lines='';
  items.forEach(function(it){
    lines+='<div class="rt-item"><span class="rt-n">'+it[0]+'</span><span class="rt-d">'+it[1]+'</span></div>'+
      (it[2]?'<div class="rt-c">'+it[2]+'</div>':'');
  });
  return '<div class="block" style="border:1px solid '+accent+'"><div class="bl">'+title+'</div>'+lines+
    (last?'<div class="ex-log">✓ '+entrySummary(last)+'</div>':'')+
    '<button class="blogb'+(last?' done':'')+'" data-k="'+key+'" data-n="'+encodeURIComponent(title)+'" data-t="routine" data-l="">'+
    (last?'✓ geloggt · bearbeiten':'Block abhaken')+'</button></div>';
}

function parseTarget(typ,label){
  label=label||'';
  if(typ==='strength'){
    var m=label.match(/(\d+)\s*[×x]\s*(\d+)\s*@\s*([\d.,]+)\s*kg/i);
    if(!m) return null;
    var rpeM=label.match(/RPE\s*([\d.,]+)/i);
    return {sets:parseInt(m[1]),reps:m[2],kg:m[3],rpe:rpeM?rpeM[1]:''};
  }
  if(typ==='labour'){
    var idx=label.indexOf('@');
    if(idx>-1) return {a:label.slice(0,idx).trim(),b:label.slice(idx+1).trim(),c:''};
    return {a:label,b:'',c:''};
  }
  if(typ==='run'){
    var pm=label.match(/@\s*([0-9:–\-,\s]+)/);
    return {a:'',b:pm?pm[1].trim():'',c:''};
  }
  if(typ==='time'){ return {a:label,b:'',c:''}; }
  return null;
}

  var last=getLog(k);
  var noteDefault = last ? (last.note||'') : (targetLabel?'Ziel: '+targetLabel:'');
  var prefill;
  if(last){
    prefill={a:last.a||'',b:last.b||'',c:last.c||'',note:noteDefault};
  } else {
    var t=parseTarget(typ,targetLabel);
    prefill = t ? {a:t.a||'',b:t.b||'',c:t.c||'',note:noteDefault} : {note:noteDefault};
  }
  document.getElementById('s-log').innerHTML=
    '<h3>'+name+'</h3><div class="sh-sub">'+new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'})+'</div>'+
    '<div style="display:flex;gap:8px;margin-bottom:14px">'+
      '<button class="logtab on" id="ltab-new" style="flex:1;text-align:center;padding:8px;border-radius:9px;border:1px solid var(--border);background:var(--card2);color:var(--text)">Eintragen</button>'+
      '<button class="logtab" id="ltab-hist" style="flex:1;text-align:center;padding:8px;border-radius:9px;border:1px solid var(--border);background:transparent;color:var(--text2)">Verlauf ('+getLogArray(k).length+')</button>'+
    '</div>'+
    '<div id="lpanel-new">'+logEntryFormHtml(typ,prefill)+
      '<button class="btn" id="lg-save" data-k="'+k+'" data-t="'+typ+'">Speichern</button>'+
      '<button class="btn sec" style="margin-top:8px" data-close="m-log">Abbrechen</button></div>'+
    '<div id="lpanel-hist" style="display:none">'+historyHtml(k)+'</div>';
  if(typ==='strength'){
    if(last && last.sets && last.sets.length){
      last.sets.forEach(function(s){ addSetRow(s.kg,s.reps,s.rpe); });
    } else {
      var pt=parseTarget('strength',targetLabel);
      if(pt){ for(var i=0;i<pt.sets;i++) addSetRow(pt.kg,pt.reps,pt.rpe); }
      else { addSetRow(); addSetRow(); addSetRow(); }
    }
  }
  document.getElementById('m-log').classList.add('on');
}
function saveLog(k,typ){
  var n=(document.getElementById('f4')||{}).value||'', entry;
  if(typ==='strength'){
    var sets=[];
    document.querySelectorAll('#log-set-rows .set-row').forEach(function(row){
      var kg=row.querySelector('.sf-kg').value, reps=row.querySelector('.sf-reps').value, rpe=row.querySelector('.sf-rpe').value;
      if(kg||reps) sets.push({kg:kg,reps:reps,rpe:rpe});
    });
    entry={type:'strength',sets:sets,note:n,date:new Date().toISOString()};
  } else {
    var a=(document.getElementById('f1')||{}).value||'',
        b=(document.getElementById('f2')||{}).value||'',
        c=(document.getElementById('f3')||{}).value||'';
    entry={type:typ,a:a,b:b,c:c,note:n,date:new Date().toISOString()};
  }
  pushLog(k,entry);
  document.getElementById('m-log').classList.remove('on');
  render();
}

/* ============ HRV ============ */
function hrvCheck(){
  var el=document.getElementById('hrvin'); if(!el) return;
  var v=parseFloat(el.value), out=document.getElementById('hrvout');
  if(isNaN(v)){ out.style.display='none'; return; }
  ls('z3_hrv_'+new Date().toDateString(), String(v));
  var txt,bg,col;
  if(v<65){ txt='Rot. Intensität heute runter: Lasten −10 bis −15 %, Intervalle halbieren oder auf Z2 wechseln. Simulationen verschieben.'; bg='rgba(255,69,58,.12)'; col='var(--red)'; }
  else if(v<=75){ txt='Gelb. Plan wie geschrieben, aber ohne Extras. Kein Ausbelasten in den Labours.'; bg='rgba(255,176,32,.12)'; col='var(--amber)'; }
  else { txt='Grün. Vollgas. Wenn heute Simulation oder scharfe Intervalle anstehen – heute ist der Tag dafür.'; bg='rgba(48,209,88,.12)'; col='var(--green)'; }
  out.style.display='block'; out.style.background=bg; out.style.color=col; out.textContent=txt;
}

/* ============ GITHUB ============ */
function feed(msg,ok){
  var f=document.getElementById('gh-feed'); if(!f) return;
  f.style.display='block'; f.textContent=msg;
  f.style.background = ok?'rgba(48,209,88,.12)':'rgba(255,69,58,.12)';
  f.style.color = ok?'var(--green)':'var(--red)';
}
function b64(s){ return btoa(unescape(encodeURIComponent(s))); }
function ghUpload(){
  var repo=ls('z3_gh_repo'), path=ls('z3_gh_path'), br=ls('z3_gh_branch')||'main', tok=ls('z3_gh_token');
  if(!repo||!path||!tok){ feed('Repository, Pfad und Token zuerst speichern.',false); return; }
  var body=JSON.stringify({exported:new Date().toISOString(),plan:'Z3 Deadly Dozen',logs:allLogs()},null,2);
  var url='https://api.github.com/repos/'+repo+'/contents/'+path;
  feed('Lade hoch …',true);
  fetch(url+'?ref='+br,{headers:{Authorization:'token '+tok,Accept:'application/vnd.github+json'}})
   .then(function(r){ return r.status===200?r.json():null; })
   .then(function(j){
      return fetch(url,{method:'PUT',headers:{Authorization:'token '+tok,Accept:'application/vnd.github+json','Content-Type':'application/json'},
        body:JSON.stringify({message:'Z3 Logs '+new Date().toLocaleDateString('de-DE'),content:b64(body),branch:br,sha:j&&j.sha?j.sha:undefined})});
   })
   .then(function(r){ if(r.ok) feed('Hochgeladen: '+path,true); else r.json().then(function(e){feed('Fehler: '+(e.message||r.status),false)}); })
   .catch(function(e){ feed('Netzwerkfehler: '+e.message,false); });
}

/* ============ EVENTS ============ */
document.addEventListener('click',function(e){
  var t=e.target.closest('.tab'); if(t){ cur=parseInt(t.dataset.w); document.getElementById('v-plan').innerHTML=buildWeek(cur); tabs(); window.scrollTo(0,0); return; }
  var h=e.target.closest('.dh'); if(h){ var d=e.target.closest('.day'); if(d) d.classList.toggle('open'); return; }
  var ib=e.target.closest('.ib'); if(ib){ openInfo(decodeURIComponent(ib.dataset.i)); return; }
  var fbo=e.target.closest('.fb-open,.fb-summary'); if(fbo){ openFb(parseInt(fbo.dataset.fbw),parseInt(fbo.dataset.fbi)); return; }
  var fbe=e.target.closest('.fb-emoji'); if(fbe){
    document.querySelectorAll('.fb-emoji').forEach(function(x){x.classList.remove('sel')});
    fbe.classList.add('sel'); window._fbEmoji=fbe.dataset.emoji; return;
  }
  var fbs=e.target.closest('.fb-star'); if(fbs){
    var n=parseInt(fbs.dataset.star); window._fbStars=n;
    document.querySelectorAll('.fb-star').forEach(function(x,idx){ x.classList.toggle('on', idx<n); }); return;
  }
  if(e.target.id==='fb-save'){ saveFb(parseInt(e.target.dataset.fbw),parseInt(e.target.dataset.fbi)); return; }
  var lb=e.target.closest('.logb,.blogb'); if(lb){ openLog(lb.dataset.k,decodeURIComponent(lb.dataset.n),lb.dataset.t,decodeURIComponent(lb.dataset.l||'')); return; }
  var cl=e.target.closest('[data-close]'); if(cl){ document.getElementById(cl.dataset.close).classList.remove('on'); return; }
  if(e.target.id==='lg-save'){ saveLog(e.target.dataset.k,e.target.dataset.t); return; }
  if(e.target.id==='add-set-btn'){ addSetRow(); return; }
  if(e.target.closest('[data-delrow]')){ var row=e.target.closest('.set-row'); if(row) row.remove(); renumberSetRows(); return; }
  if(e.target.id==='ltab-new'){
    document.getElementById('ltab-new').classList.add('on'); document.getElementById('ltab-new').style.background='var(--card2)'; document.getElementById('ltab-new').style.color='var(--text)';
    document.getElementById('ltab-hist').classList.remove('on'); document.getElementById('ltab-hist').style.background='transparent'; document.getElementById('ltab-hist').style.color='var(--text2)';
    document.getElementById('lpanel-new').style.display='block'; document.getElementById('lpanel-hist').style.display='none'; return;
  }
  if(e.target.id==='ltab-hist'){
    document.getElementById('ltab-hist').classList.add('on'); document.getElementById('ltab-hist').style.background='var(--card2)'; document.getElementById('ltab-hist').style.color='var(--text)';
    document.getElementById('ltab-new').classList.remove('on'); document.getElementById('ltab-new').style.background='transparent'; document.getElementById('ltab-new').style.color='var(--text2)';
    document.getElementById('lpanel-hist').style.display='block'; document.getElementById('lpanel-new').style.display='none'; return;
  }
  var hd=e.target.closest('[data-histdel]'); if(hd){
    deleteLogAt(hd.dataset.histk, parseInt(hd.dataset.histdel));
    document.getElementById('lpanel-hist').innerHTML=historyHtml(hd.dataset.histk);
    document.getElementById('ltab-hist').textContent='Verlauf ('+getLogArray(hd.dataset.histk).length+')';
    render(); return;
  }
  if(e.target.id==='hrvbtn'){ hrvCheck(); return; }
  if(e.target.id==='btn-ghsave'){
    ls('z3_gh_repo',document.getElementById('gh-repo').value.trim());
    ls('z3_gh_path',document.getElementById('gh-path').value.trim());
    ls('z3_gh_branch',document.getElementById('gh-branch').value.trim()||'main');
    ls('z3_gh_token',document.getElementById('gh-token').value.trim());
    feed('Zugangsdaten gespeichert.',true); return;
  }
  if(e.target.id==='btn-ghup'){ ghUpload(); return; }
  if(e.target.id==='btn-export-today'){
    var td=todayLogs(), tf=todayFeedback(), n=Object.keys(td).length+Object.keys(tf).length;
    if(!n){ alert('Für heute ist noch nichts geloggt.'); return; }
    var data=JSON.stringify({exported:new Date().toISOString(),day:new Date().toDateString(),logs:td,feedback:tf},null,2);
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));
    a.download='z3-tag-'+new Date().toISOString().slice(0,10)+'.json'; a.click(); return;
  }
  if(e.target.id==='btn-export'){
    var data=JSON.stringify({exported:new Date().toISOString(),logs:allLogs(),feedback:allFeedback()},null,2);
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));
    a.download='z3-logs-'+new Date().toISOString().slice(0,10)+'.json'; a.click(); return;
  }
  if(e.target.id==='btn-import'){
    try{ var j=JSON.parse(document.getElementById('imp').value); var L=j.logs||j, F=j.feedback||{};
      for(var k in L) ls(k,L[k]);
      for(var fk in F) ls(fk,F[fk]);
      render(); alert('Backup eingespielt.'); }
    catch(err){ alert('Konnte das JSON nicht lesen.'); } return;
  }
  if(e.target.id==='btn-reset'){
    if(confirm('Wirklich alle Logs und Feedback löschen?')){
      var L=allLogs(); for(var kk in L) del(kk);
      var F=allFeedback(); for(var fk2 in F) del(fk2);
      render();
    }
    return;
  }
  if(e.target.classList.contains('modal')) e.target.classList.remove('on');
});
document.querySelectorAll('.ni').forEach(function(n){
  n.addEventListener('click',function(){
    view=n.dataset.v;
    document.querySelectorAll('.ni').forEach(function(x){x.classList.remove('on')});
    document.querySelectorAll('.view').forEach(function(x){x.classList.remove('on')});
    n.classList.add('on'); document.getElementById('v-'+view).classList.add('on');
    tabs(); window.scrollTo(0,0);
  });
});
